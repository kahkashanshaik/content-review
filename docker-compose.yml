services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: content_review
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d content_review"]
      interval: 3s
      timeout: 5s
      retries: 10
